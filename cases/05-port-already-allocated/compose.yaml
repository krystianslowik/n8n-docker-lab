# n8n stack: Fernbrook Freight, self-hosted on the ops VM.
# Rebuilt 2026-07-28 when we moved off the old box. Same file as before,
# just copied across.
#
# Runbook: n8n lives on http://<vm>:5605. That port is the one the office
# firewall allows through, so don't move it.
#
# TODO(marek, 2026-02-14): get POSTGRES_PASSWORD out of .env and into the
# vault before anyone else gets read access to this repo.

name: docklab-05

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # volumes:
    #   - ./pgdata:/var/lib/postgresql/data     # moved to a named volume, 2026-03
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.33.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5605:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      # pre-provisioned owner, so nobody has to redo the setup wizard
      N8N_INSTANCE_OWNER_MANAGED_BY_ENV: "true"
      N8N_INSTANCE_OWNER_EMAIL: ${N8N_OWNER_EMAIL}
      N8N_INSTANCE_OWNER_PASSWORD_HASH: ${N8N_OWNER_PASSWORD_HASH}

      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: false
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"

      # these four only exist to shut up the deprecation block on boot
      N8N_RUNNERS_TASK_TIMEOUT: "300"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: "2147483648"
      N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: "5000"
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:5678/healthz/readiness',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Added 2026-07-30 so the data team can stop asking us for CSV exports.
  adminer:
    image: adminer:5.5.1
    depends_on:
      - postgres
    ports:
      - 5605:8080
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha
    restart: unless-stopped

volumes:
  postgres_data:
  n8n_data:
