# northwind-logistics: n8n stack (docker compose)
# handover notes live in the ops wiki, they are a bit out of date
#
# ports: n8n is on 5601 on this host because 5678 is taken by the old box

name: docklab-01

services:

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: '${POSTGRES_USER}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      POSTGRES_DB: ${POSTGRES_DB}
    # ports:
    #   - "5433:5432"      # only needed while we ran pgadmin off-box
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.33.0
    # TODO(2026-02) put this back once the upgrade is signed off
    # restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5601:5678"
    environment:
      # --- database ---
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: ${POSTGRES_HOST}
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: '${POSTGRES_USER}'
      DB_POSTGRESDB_PASSWORD: '${POSTGRES_PASSWORD}'
      # DB_POSTGRESDB_CONNECTION_TIMEOUT: 60000   # leftover from 1.x, think it does nothing now

      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      # --- login is provisioned from env, there is no signup wizard ---
      N8N_INSTANCE_OWNER_MANAGED_BY_ENV: "true"
      N8N_INSTANCE_OWNER_EMAIL: ${N8N_OWNER_EMAIL}
      N8N_INSTANCE_OWNER_PASSWORD_HASH: ${N8N_OWNER_PASSWORD_HASH}

      # went in back in November for SUP-3901, the outbound webhook calls were
      # all timing out. leave it alone
      NODEJS_PREFER_IPV4: "true"

      # --- we run behind plain http internally ---
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"

      # these four only exist to shut up the deprecation block on boot
      N8N_RUNNERS_TASK_TIMEOUT: "300"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: "2147483648"
      N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: "5000"
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:5678/healthz/readiness',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres_data:
  n8n_data:
